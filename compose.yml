services:
  ams-grafana:
    container_name: ams-grafana
    image: grafana/grafana:12.0.0
    restart: always
    ports:
      - "3000:3000"
    
    volumes:
      - ./ams-grafana-data:/var/lib/grafana 
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true
      