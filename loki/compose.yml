services:
  ams-loki:
    container_name: ams-loki
    image: grafana/loki:latest
    restart: always
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./configurations/configs.yml:/etc/loki/config.yml
      - ./ams-loki-data/loki:/loki
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true
      