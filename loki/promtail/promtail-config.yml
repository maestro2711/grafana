server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://ams-loki:3100/loki/api/v1/push

scrape_configs:
  # 🔹 Logs système & Docker via journald
  - job_name: systemd-journal
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        job: systemd
      matches:
        - _SYSTEMD_UNIT=*.service
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'

  # 🔹 Fichiers de log classiques (ex: nginx)
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
