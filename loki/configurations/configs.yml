auth_enabled: false

limits_config:
  volume_enabled: true
  allow_structured_metadata: true
  
server:
  http_listen_port: 3100
  

common:
  ring:
    instance_addr: 0.0.0.0
    kvstore:
      store: inmemory
    replication_factor: 1
    path_prefix: /tmp/loki
schema_config:
  configs:
    - from: 2025-08-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
      chunks:
        prefix: loki_chunks_
        period: 24h
      retention_period: 7d

storage:
tsdb_shipper:
  active_index_directory: /tmp/loki/index
  cache_location: /tmp/loki/cache
  type: filesystem
  config:
    directory: /tmp/loki/chunks